name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: lint, typecheck y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Sin secretos: los tests de dominio no tocan la base (DD-10, 08 §Calidad).
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests (zona del proceso UTC)
        run: npm test
        env:
          TZ: UTC
      - name: "Tests (otra zona: las fechas no dependen del servidor)"
        run: npm test
        env:
          TZ: Europe/Madrid
